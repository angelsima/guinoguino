<!DOCTYPE html>
<html lang="es" data-theme="boda">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF6EF">
<title>Guiño guiño</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E😉%3C/text%3E%3C/svg%3E">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ════ DISEÑOS ════
     boda → "Elegante": papelería de invitación. Marfil, verde salvia, oro fino, letra caligráfica.
     neon → "Neón": cartel de concierto / club. Fondo noche, rosa, lima y azul eléctrico,
            titulares condensados en mayúsculas, cinta de texto en movimiento. */
  html[data-theme=boda]{
    --bg:#F6F1E7; --card:#FFFDF8; --field:#FFFFFF; --ink:#26342B; --soft:#6E786F; --line:#E2D7C2;
    --accent:#3E5C48; --accent-ink:#FBF7EF; --accent-soft:#E6ECE2; --gold:#B39257;
    --ok:#3E5C48; --ok-soft:#EDF1E8; --err:#B3261E;
    --f-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
    --f-brand:"Great Vibes","Cormorant Garamond",Georgia,serif;
    --f-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --f-ui:var(--f-body);
    --radius:10px; --border:1px solid var(--line); --shadow:0 10px 30px rgba(38,52,43,.07);
    color-scheme:light;
  }
  html[data-theme=neon]{
    --bg:#0D0A12; --card:#17121F; --field:#110D18; --ink:#F7F3FF; --soft:#A99FBC; --line:#352B47;
    --accent:#FF2D95; --accent-ink:#0D0A12; --accent-soft:rgba(255,45,149,.14); --gold:#C8FF2E;
    --lime:#C8FF2E; --blue:#4F7BFF; --orange:#FF7A1A;
    --ok:#C8FF2E; --ok-soft:rgba(200,255,46,.10); --err:#FF6B7A;
    --f-display:"Anton","Impact","Arial Narrow Bold","Helvetica Neue",sans-serif;
    --f-brand:var(--f-display);
    --f-body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --f-ui:var(--f-body);
    --radius:14px; --border:1px solid var(--line); --shadow:0 12px 36px rgba(0,0,0,.45);
    color-scheme:dark;
  }

  *{box-sizing:border-box;min-width:0}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:clip}
  #app{max-width:560px;margin:0 auto;padding:12px 18px calc(110px + env(safe-area-inset-bottom))}
  h1,h2,.serif{font-family:var(--f-display);font-weight:600;letter-spacing:-.005em}
  h1{font-size:2.3rem;line-height:1.08;margin:.25em 0 .4em}
  h2{font-size:1.6rem;line-height:1.15;margin:.2em 0 .6em}
  [data-theme=neon] h1,[data-theme=neon] h2,[data-theme=neon] .serif{font-weight:400;text-transform:uppercase;letter-spacing:.01em}
  [data-theme=neon] h1{font-size:clamp(2.6rem,12vw,3.6rem);line-height:.95}
  [data-theme=neon] h1 .out{display:block;color:transparent;-webkit-text-stroke:1.5px var(--ink)}
  [data-theme=neon] h2{font-size:1.75rem;line-height:1.1}
  p{margin:.4em 0 .9em}
  .muted{color:var(--soft)} .small{font-size:.86rem} .center{text-align:center}
  b,strong{font-weight:700}

  /* marca y nombre del evento */
  .brand{font-family:var(--f-brand);color:var(--gold);font-size:1.9rem;line-height:1.1;display:inline-block}
  .brand.sm{font-size:1.45rem}
  [data-theme=neon] .brand{font-size:1rem;letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}
  [data-theme=neon] .brand.sm{font-size:.9rem}
  .evname{font-family:var(--f-display);font-size:1.25rem;line-height:1.2;margin-top:2px}
  [data-theme=boda] .evname{font-style:italic}
  [data-theme=neon] .evname{font-family:var(--f-body);font-weight:600;font-size:1rem;color:var(--soft);margin-top:4px}
  .head{text-align:center}
  [data-theme=neon] .head{text-align:left}

  /* decoración: ramita (boda) / cinta en movimiento (neón) */
  .deco{display:block;margin:4px auto 6px}
  .deco.sprig{width:220px;height:auto}
  .modal .deco.sprig{width:180px}
  .ticker{overflow:hidden;background:var(--lime);color:#0D0A12;margin:-12px -18px 14px;transform:rotate(-1.5deg) scale(1.03);border-block:2px solid #0D0A12}
  .ticker .track{display:inline-flex;white-space:nowrap;font:400 1rem/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:.55em 0;animation:tick 18s linear infinite}
  .ticker .track span{padding:0 .6em}
  .ticker .track i{font-style:normal;color:var(--accent)}
  .modal .ticker{margin:-24px -20px 16px;transform:none;border-radius:14px 14px 0 0;border-top:0}
  @keyframes tick{to{transform:translateX(-50%)}}

  .card{background:var(--card);border:var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin:14px 0}
  [data-theme=boda] .card{outline:1px solid var(--line);outline-offset:-7px}

  /* botones */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;border:0;border-radius:999px;padding:.85em 1.4em;font:600 1rem var(--f-ui);cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none;transition:transform .08s,opacity .2s,box-shadow .2s;min-height:44px}
  [data-theme=boda] .btn{letter-spacing:.04em}
  [data-theme=neon] .btn{border-radius:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.92rem;box-shadow:0 0 0 0 rgba(255,45,149,0)}
  [data-theme=neon] .btn:not(.ghost):not(.soft):not(.okb):not([disabled]):hover{box-shadow:0 0 24px rgba(255,45,149,.45)}
  .btn:active{transform:scale(.97)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .btn[disabled]{opacity:.45;cursor:default}
  .btn.block{display:flex;width:100%}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
  [data-theme=boda] .btn.ghost{border-color:var(--gold)}
  .btn.soft{background:var(--accent-soft);color:var(--accent)}
  .btn.okb{background:var(--ok-soft);color:var(--ok)}
  [data-theme=neon] .btn.okb{border:1.5px solid var(--lime)}
  .btn.small{padding:.55em 1em;font-size:.9rem}
  [data-theme=neon] .btn.small{font-size:.8rem}

  /* bienvenida */
  .steps{list-style:none;padding:0;margin:18px 0}
  .steps li{display:flex;gap:12px;align-items:flex-start;margin:12px 0}
  .steps b.n{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 .95rem var(--f-display)}
  [data-theme=boda] .steps b.n{border:1px solid var(--gold);color:var(--gold);font-size:1.1rem}
  [data-theme=neon] .steps b.n{border-radius:8px;font:400 1.05rem var(--f-display);color:#0D0A12}
  [data-theme=neon] .steps li:nth-child(1) b.n{background:var(--lime)}
  [data-theme=neon] .steps li:nth-child(2) b.n{background:var(--blue);color:#fff}
  [data-theme=neon] .steps li:nth-child(3) b.n{background:var(--accent)}
  .lead{font-size:1.05rem}
  [data-theme=boda] .welcome{text-align:center}
  [data-theme=boda] .welcome .steps{text-align:left;max-width:420px;margin-left:auto;margin-right:auto}

  /* formulario */
  label.f{display:block;font-weight:600;margin:18px 0 6px}
  [data-theme=neon] label.f{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
  input[type=text],textarea{width:100%;font:inherit;font-size:16px;padding:.75em .9em;border:1.5px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink)}
  textarea{resize:vertical;min-height:84px}
  input[type=text]:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  ::placeholder{color:var(--soft);opacity:.8}
  .seg{display:flex;flex-wrap:wrap;gap:8px}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg label{padding:.55em 1em;border:1.5px solid var(--line);border-radius:999px;cursor:pointer;background:var(--field);font-size:.95rem;min-height:40px;display:inline-flex;align-items:center}
  .seg input:checked+label{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
  [data-theme=neon] .seg label{border-radius:10px}
  [data-theme=neon] .seg input:checked+label{background:var(--lime);border-color:var(--lime);color:#0D0A12;font-weight:700}
  .seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
  .check{display:flex;gap:10px;align-items:flex-start;margin:18px 0;font-size:.92rem}
  .check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
  .selfie{position:relative;width:210px;height:210px;margin:6px auto 12px;border-radius:50%;overflow:hidden;background:var(--accent-soft);display:flex;align-items:center;justify-content:center}
  [data-theme=boda] .selfie{border:4px solid var(--card);box-shadow:0 0 0 1px var(--gold),var(--shadow)}
  [data-theme=neon] .selfie{border:4px solid var(--bg);box-shadow:0 0 0 3px var(--accent),0 0 40px rgba(255,45,149,.35)}
  .selfie video,.selfie img{width:100%;height:100%;object-fit:cover}
  .selfie video{transform:scaleX(-1)}
  .selfie .ph{font-size:3.2rem;opacity:.55}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .err{color:var(--err);font-size:.9rem;min-height:1.2em;margin-top:10px}

  /* pantalla principal */
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
  .pill{display:inline-block;border-radius:999px;padding:.35em .85em;font:600 .85rem var(--f-ui);white-space:nowrap}
  [data-theme=boda] .pill{border:1px solid var(--gold);color:var(--accent);background:var(--card)}
  [data-theme=neon] .pill{background:var(--lime);color:#0D0A12;border-radius:8px;font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
  .person{background:var(--card);border:var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
  [data-theme=boda] .person{padding:6px 6px 0}
  [data-theme=boda] .person img{border-radius:6px}
  .person img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--accent-soft)}
  [data-theme=neon] .person img{aspect-ratio:4/5}
  .person .body{padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
  .person .name{font:600 1.1rem var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  [data-theme=boda] .person .name{text-align:center;font-size:1.25rem}
  [data-theme=neon] .person .name{font-weight:400;text-transform:uppercase;font-size:1.3rem;letter-spacing:.02em}
  .person .side{font-size:.78rem;color:var(--soft);margin-top:-4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  [data-theme=boda] .person .side{text-align:center;font-style:italic;font-family:var(--f-display);font-size:.95rem}
  .person .btn{width:100%;margin-top:auto}
  .person.matched{outline:2px solid var(--ok);outline-offset:-2px}
  [data-theme=neon] .person.matched{box-shadow:0 0 24px rgba(200,255,46,.25)}
  .empty{text-align:center;padding:34px 16px;color:var(--soft)}
  .empty .big{font-size:2.6rem}

  .tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}
  .tabs .in{display:flex;max-width:560px;width:100%}
  .tabs button{flex:1;border:0;background:none;font:500 .82rem var(--f-ui);color:var(--soft);padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative;min-height:44px}
  .tabs button .ic{font-size:1.35rem}
  .tabs button.on{color:var(--accent);font-weight:700}
  .tabs .badge{position:absolute;top:0;left:calc(50% + 8px);background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:.7rem;padding:1px 6px;font-weight:700}
  .mrow{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
  .mrow:last-child{border-bottom:0}
  .mrow img{width:84px;height:84px;border-radius:50%;object-fit:cover;flex:none;background:var(--accent-soft)}
  [data-theme=boda] .mrow img{box-shadow:0 0 0 1px var(--gold);border:3px solid var(--card)}
  [data-theme=neon] .mrow img{box-shadow:0 0 0 2px var(--accent)}
  .hint{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:.55em .85em;font-size:.95rem;margin-top:4px}
  [data-theme=boda] .hint{font-family:var(--f-display);font-size:1.12rem;background:transparent;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0}
  [data-theme=neon] .hint{color:var(--ink);background:transparent;border-left:3px solid var(--lime);border-radius:0;padding:.3em .9em}
  .info{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;background:transparent;color:var(--soft);font:700 12px/1 Georgia,serif;font-style:italic;cursor:pointer;padding:0;vertical-align:1px;margin-left:4px}
  .info:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .grpfaces{display:flex;justify-content:center;margin:12px 0 10px;flex-wrap:wrap}
  .grpfaces img{width:78px;height:78px;border-radius:50%;object-fit:cover;border:3px solid var(--card);margin-left:-14px;box-shadow:var(--shadow);cursor:zoom-in}
  .grpfaces img:first-child{margin-left:0}
  .grpfaces.sm{justify-content:flex-start}.grpfaces.sm img{width:54px;height:54px;margin-left:-10px}
  [data-theme=boda] .grpfaces img{box-shadow:0 0 0 1px var(--gold)}
  [data-theme=neon] .grpfaces img{box-shadow:0 0 0 2px var(--accent),0 0 18px rgba(255,45,149,.35)}
  [data-theme=neon] .grpfaces img:nth-child(even){box-shadow:0 0 0 2px var(--lime),0 0 18px rgba(200,255,46,.3)}
  [data-theme=neon] .grpcard{border-color:var(--accent);box-shadow:0 0 30px rgba(255,45,149,.25)}
  [data-theme=boda] .grpcard{outline-color:var(--gold)}
  .igwrap{margin-top:10px;width:100%}
  .mrow .igwrap{margin-top:2px}
  .igin{display:flex;flex-direction:column;gap:8px;align-items:center;padding:10px;border-radius:12px;background:var(--ok-soft);color:var(--ink);font-size:.92rem}
  .mrow .igin{align-items:flex-start;padding:8px 10px}
  [data-theme=neon] .igin{border:1px solid var(--lime)}
  .igin .btn{text-transform:none;letter-spacing:.01em}
  .sidetag{display:inline-block;font-size:.82rem;color:var(--soft);margin:2px 0 6px}
  [data-theme=boda] .sidetag{font-family:var(--f-display);font-style:italic;font-size:1rem}
  [data-theme=neon] .sidetag{color:var(--lime);font-weight:600;letter-spacing:.02em}

  /* ventanas */
  .overlay{position:fixed;inset:0;background:rgba(20,15,20,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20;animation:fade .2s}
  [data-theme=neon] .overlay{background:rgba(5,3,8,.78)}
  .modal{background:var(--bg);border-radius:24px;padding:24px 20px;max-width:400px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .25s;overflow:hidden}
  [data-theme=boda] .modal{border-radius:12px;outline:1px solid var(--gold);outline-offset:-10px;padding:30px 26px}
  [data-theme=neon] .modal{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 0 0 1px rgba(255,45,149,.35),0 0 60px rgba(255,45,149,.25)}
  .pair{display:flex;justify-content:center;align-items:center;margin:10px 0 14px}
  .pair img{width:104px;height:104px;border-radius:50%;object-fit:cover;border:4px solid var(--card);box-shadow:var(--shadow)}
  [data-theme=neon] .pair img{border-color:var(--card);box-shadow:0 0 0 2px var(--accent)}
  [data-theme=neon] .pair img+img{box-shadow:0 0 0 2px var(--lime),0 0 30px rgba(200,255,46,.3)}
  .pair img+img{margin-left:-18px;width:148px;height:148px}
  .person img,.mrow img,.pair img{cursor:zoom-in}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
  @keyframes fade{from{opacity:0}}
  @media (prefers-reduced-motion:reduce){.overlay,.modal{animation:none}.ticker .track{animation:none}}
  #toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.7em 1.1em;border-radius:14px;font-size:.92rem;max-width:90vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
  #toast.on{opacity:1}

  /* aviso de demo con selectores */
  .demo{background:#FFF3C9;color:#5C4700;border-radius:12px;padding:.55em .8em;font-size:.82rem;margin:4px 0 14px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center;text-align:center}
  .demo .pick{display:inline-flex;border:1.5px solid #D9C27A;border-radius:999px;overflow:hidden}
  .demo .pick button{border:0;background:transparent;font:600 .8rem -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:.35em .8em;cursor:pointer;color:#5C4700;min-height:32px}
  .demo .pick button.on{background:#5C4700;color:#FFF3C9}
  .demo .lbl{font-weight:600}
  .spin{width:34px;height:34px;border:3px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:80px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div class="spin"></div></div>
<div id="toast"></div>

<script type="module">
/* ══════════════════════════════════════════════════════════════
   Guiño guiño — web de invitados
   Flujo: QR → ficha con selfie → radar → guiños → match
   ══════════════════════════════════════════════════════════════ */

if (!window.GUINO) { document.getElementById("app").innerHTML = '<div class="empty"><div class="big">⚠️</div><h2>Error en config.js</h2><p>El archivo de configuración tiene un fallo de escritura (revisa dos puntos, comas y llaves).</p></div>'; throw new Error("config.js no se ha cargado"); }
const CFG = window.GUINO;
const APP_NAME = CFG.appName || "Guiño guiño";
const MAX_SIGNALS = CFG.maxSignals || 3;
const params = new URLSearchParams(location.search);
const DEMO = !CFG.firebaseConfig?.apiKey || params.has("demo");
document.title = APP_NAME;

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeImg = (u) => (typeof u === "string" && u.startsWith("data:image/")) ? esc(u) : "";

/* ─────────────── Estado ─────────────── */
const S = {
  api: null, eventId: null, event: null, uid: null,
  me: null, profiles: [], sentTo: new Set(), matches: [],
  view: "loading", tab: "radar", editing: false,
  selfie: null, stream: null, errorMsg: "", watching: false, seenKey: "",
  contacts: {}, matchBusy: false,
  igIn: {}, igOut: {}, pairs: {}, groups: []
};

/* ══════════════ BACKEND: Firebase ══════════════ */
async function makeFirebaseApi(cfg) {
  const V = "10.12.2";
  const [appM, authM, fs] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`)
  ]);
  const app = appM.initializeApp(cfg);
  const auth = authM.getAuth(app);
  const db = fs.getFirestore(app);
  const { doc, getDoc, setDoc, deleteDoc, collection, onSnapshot, query, where, getDocs, serverTimestamp, writeBatch } = fs;
  const col = (eid, name) => collection(db, "events", eid, name);

  return {
    async signIn() {
      const user = await new Promise(res => { const un = authM.onAuthStateChanged(auth, u => { un(); res(u); }); });
      if (user) return user.uid;
      return (await authM.signInAnonymously(auth)).user.uid;
    },
    async getEvent(eid) {
      const snap = await getDoc(doc(db, "events", eid));
      if (!snap.exists()) return null;
      const d = snap.data();
      return normEvent({ name: d.name, active: d.active !== false, endsAt: d.endsAt?.toMillis?.() ?? 0, theme: d.theme, kind: d.kind, sides: d.sides, groups: d.groups });
    },
    async getMyProfile(eid, uid) {
      try {
        const s = await getDoc(doc(db, "events", eid, "profiles", uid));
        if (!s.exists()) return null;
        let c = {};
        try { const cs = await getDoc(doc(db, "events", eid, "contacts", uid)); if (cs.exists()) c = cs.data(); } catch {}
        let g = false;
        try { const os = await getDoc(doc(db, "events", eid, "optins", uid)); g = os.exists() && os.data().group === true; } catch {}
        return { id: uid, ...s.data(), message: c.message || "", group: g };
      } catch { return null; }
    },
    // La ficha (pública para el evento) y el mensaje para los matches (privado) van en documentos distintos.
    async saveProfile(eid, uid, data) {
      const { message, group, ...profile } = data;
      const b = writeBatch(db);
      b.set(doc(db, "events", eid, "profiles", uid), { ...profile, updatedAt: serverTimestamp() });
      b.set(doc(db, "events", eid, "contacts", uid), { message: message || "", updatedAt: serverTimestamp() });
      b.set(doc(db, "events", eid, "optins", uid), { group: group === true, updatedAt: serverTimestamp() });
      await b.commit();
    },
    async getContact(eid, otherUid) {
      try {
        const s = await getDoc(doc(db, "events", eid, "contacts", otherUid));
        return s.exists() ? { message: s.data().message || "" } : null;
      } catch { return null; }
    },
    async deleteMe(eid, uid) {
      const mine = await getDocs(query(col(eid, "signals"), where("from", "==", uid)));
      await Promise.all(mine.docs.map(d => deleteDoc(d.ref)));
      const shares = await getDocs(query(col(eid, "shares"), where("from", "==", uid)));
      await Promise.all(shares.docs.map(d => deleteDoc(d.ref)));
      const b = writeBatch(db);
      b.delete(doc(db, "events", eid, "contacts", uid));
      b.delete(doc(db, "events", eid, "optins", uid));
      b.delete(doc(db, "events", eid, "profiles", uid));
      await b.commit();
    },
    watchProfiles(eid, cb, onErr) {
      return onSnapshot(col(eid, "profiles"), s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), onErr);
    },
    watchMySignals(eid, uid, cb, onErr) {
      return onSnapshot(query(col(eid, "signals"), where("from", "==", uid)), s => cb(s.docs.map(d => d.data().to)), onErr);
    },
    watchMatches(eid, uid, cb, onErr) {
      return onSnapshot(query(col(eid, "matches"), where("members", "array-contains", uid)),
        s => cb(s.docs.map(d => ({ id: d.id, members: d.data().members }))), onErr);
    },
    // Escucha un documento concreto (Instagram enviado de "from" a "to"). Documento a documento,
    // para que las reglas se comprueben con certeza (las consultas con "o" pueden fallar).
    watchShareDoc(eid, from, to, cb) {
      return onSnapshot(doc(db, "events", eid, "shares", `${from}_${to}`),
        s => cb(s.exists() ? s.data().ig : null), e => { console.warn("share", e?.code); cb(null); });
    },
    // ¿Han hecho match entre sí dos de mis matches? (las reglas solo lo permiten en grupos voluntarios)
    watchMatchPair(eid, a, b, cb) {
      const id = [a, b].sort().join("_");
      return onSnapshot(doc(db, "events", eid, "matches", id), s => cb(s.exists()), () => cb(false));
    },
    async sendIg(eid, uid, to, ig) {
      await setDoc(doc(db, "events", eid, "shares", `${uid}_${to}`), { from: uid, to, ig, createdAt: serverTimestamp() });
    },
    async sendSignal(eid, uid, to) {
      await setDoc(doc(db, "events", eid, "signals", `${uid}_${to}`), { from: uid, to, createdAt: serverTimestamp() });
      // Las reglas solo te dejan ver el guiño de vuelta si tú ya has mandado la tuya.
      let back = null;
      try { back = await getDoc(doc(db, "events", eid, "signals", `${to}_${uid}`)); } catch { return false; }
      if (!back.exists()) return false;
      const members = [uid, to].sort();
      try { await setDoc(doc(db, "events", eid, "matches", members.join("_")), { members, createdAt: serverTimestamp() }); }
      catch { /* la otra persona ya lo creó: da igual */ }
      return true;
    }
  };
}

/* ─────────────── Escuchas por match: Instagram y grupos ─────────────── */
const SUBS = { share: {}, pair: {} };
const groupsOn = () => !!S.event?.groups && S.me?.group === true;
function syncPartners() {
  const partners = [...new Set(S.matches.map(otherOf).filter(Boolean))].sort();
  for (const id of partners) {
    if (SUBS.share[id]) continue;
    let first = true;
    SUBS.share[id] = [
      S.api.watchShareDoc(S.eventId, id, S.uid, ig => {
        const had = S.igIn[id];
        if (ig) S.igIn[id] = ig; else delete S.igIn[id];
        refreshIg();
        if (ig && !had && !first) { const p = profileById(id); if (p) { toast(`📸 ${p.name} te ha enviado su Instagram`); navigator.vibrate?.(60); } }
        first = false;
      }),
      S.api.watchShareDoc(S.eventId, S.uid, id, ig => { if (ig) S.igOut[id] = ig; else delete S.igOut[id]; refreshIg(); })
    ];
  }
  if (!groupsOn()) return;
  for (let i = 0; i < partners.length; i++) for (let j = i + 1; j < partners.length; j++) {
    const key = partners[i] + "_" + partners[j];
    if (SUBS.pair[key]) continue;
    SUBS.pair[key] = S.api.watchMatchPair(S.eventId, partners[i], partners[j], ex => { S.pairs[key] = ex; computeGroups(); });
  }
}
// Grupos = conjuntos máximos de mis matches que también han hecho match entre todos ellos (+ yo).
function computeGroups() {
  const partners = [...new Set(S.matches.map(otherOf).filter(Boolean))].sort();
  const edge = (a, b) => S.pairs[[a, b].sort().join("_")] === true;
  const cliques = [];
  const n = partners.length;
  for (let mask = 1; mask < (1 << n); mask++) {
    const set = partners.filter((_, i) => mask & (1 << i));
    if (set.length < 2) continue;
    let ok = true;
    for (let i = 0; i < set.length && ok; i++) for (let j = i + 1; j < set.length && ok; j++) if (!edge(set[i], set[j])) ok = false;
    if (ok) cliques.push(set);
  }
  const maximal = cliques.filter(c => !cliques.some(d => d.length > c.length && c.every(x => d.includes(x))));
  const before = JSON.stringify(S.groups);
  S.groups = groupsOn() ? maximal : [];
  if (JSON.stringify(S.groups) !== before) { if (S.view === "main") render(); checkNewMatches(); }
}

    o.innerHTML = `<div class="modal"><h2 class="serif">Envía tu Instagram a ${esc(p.name)}</h2>

/* ─────────────── Arranque ─────────────── */
async function boot() {
  try {
    S.eventId = params.get("e") || (DEMO ? "demo" : null);
    if (!S.eventId) return showError("Falta el código del evento", "Escanea el QR que hay en el evento para entrar.");
    S.seenKey = `guino-seen-${S.eventId}`;
    S.api = DEMO ? makeDemoApi() : await makeFirebaseApi(CFG.firebaseConfig);
    S.uid = await S.api.signIn();
    S.event = await S.api.getEvent(S.eventId);
    if (S.event) applyTheme(S.event.theme);
    if (!S.event) return showError("Este evento no existe", "Revisa que has escaneado el QR correcto.");
    if (ended()) return showEnded();
    S.me = await S.api.getMyProfile(S.eventId, S.uid);
    if (S.me) startMain(); else { S.view = "welcome"; render(); }
  } catch (e) {
    console.error(e);
    showError("No se ha podido conectar", "Comprueba tu conexión y vuelve a intentarlo.");
  }
}
function showError(title, text) { S.view = "error"; S.errorMsg = { title, text }; render(); }
function showEnded() { stopCam(); S.view = "ended"; render(); }

function startMain() {
  S.view = "main";
  if (!S.watching) {
    S.watching = true;
    const onErr = (e) => { console.error(e); if (String(e?.code).includes("permission")) showEnded(); };
    S.api.watchProfiles(S.eventId, list => { S.profiles = list; if (S.view === "main") render(); checkNewMatches(); }, onErr);
    S.api.watchMySignals(S.eventId, S.uid, tos => { S.sentTo = new Set(tos); if (S.view === "main") render(); }, onErr);
    S.api.watchMatches(S.eventId, S.uid, ms => { S.matches = ms; if (S.view === "main") render(); checkNewMatches(); ensureContacts(false); syncPartners(); }, onErr);
    setInterval(() => { if (S.view === "main" && ended()) showEnded(); }, 30000);
  }
  render();
}

function checkNewMatches() {
  if (S.matchBusy || $(".overlay.match")) return;
  const seen = seenSet();
  const g = S.groups.find(x => !seen.has(groupId(x)));
  if (g) { S.matchBusy = true; if (showGroup(g)) { markSeen(groupId(g)); return; } S.matchBusy = false; }
  const m = S.matches.find(x => !seen.has(x.id));
  if (!m) return;
  const p = profileById(otherOf(m));
  if (!p) return; // aún no ha llegado su ficha; reintentará en la próxima actualización
  markSeen(m.id);
  S.matchBusy = true;
  showMatch(p);
}

/* ── Cámara ── */
async function startCam() {
  stopCam();
  if (!navigator.mediaDevices?.getUserMedia) return $("#file").click();
  try {
    S.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 720 }, height: { ideal: 720 } }, audio: false });
    $("#sbox").innerHTML = `<video id="vid" playsinline muted autoplay></video>`;
    const v = $("#vid"); v.srcObject = S.stream; await v.play().catch(() => {});
    $("#camrow").innerHTML = `<button class="btn ghost small" id="cancelcam">Cancelar</button><button class="btn small" id="snap">📸 Hacer foto</button>`;
    $("#snap").onclick = () => { S.selfie = squareJpeg(v, v.videoWidth, v.videoHeight, true); stopCam(); refreshSelfie(); };
    $("#cancelcam").onclick = () => { stopCam(); refreshSelfie(); };
  } catch (e) {
    console.warn("Cámara no disponible, uso selector de archivo", e);
    $("#file").click();
  }
}
function stopCam() { S.stream?.getTracks().forEach(t => t.stop()); S.stream = null; }
function refreshSelfie() {
  $("#sbox").innerHTML = S.selfie ? `<img src="${safeImg(S.selfie)}" alt="Tu selfie">` : `<span class="ph">🤳</span>`;
  $("#camrow").innerHTML = `<button class="btn ${S.selfie ? "ghost" : ""} small" id="cam">${S.selfie ? "Repetir selfie" : "Hacer selfie"}</button>`;
  $("#cam").onclick = startCam;
}
function squareJpeg(src, w, h, mirror) {
  const size = 360, side = Math.min(w, h);
  const c = document.createElement("canvas"); c.width = c.height = size;
  const ctx = c.getContext("2d");
  if (mirror) { ctx.translate(size, 0); ctx.scale(-1, 1); }
  ctx.drawImage(src, (w - side) / 2, (h - side) / 2, side, side, 0, 0, size, size);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  brighten(ctx, size);
  return c.toDataURL("image/jpeg", 0.72);
}
// Si la foto sale oscura (discoteca, terraza de noche), levanta las sombras con una curva de gamma.
function brighten(ctx, size) {
  try {
    const d = ctx.getImageData(0, 0, size, size), p = d.data;
    let sum = 0, n = 0;
    for (let i = 0; i < p.length; i += 16) { sum += 0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2]; n++; }
    const mean = sum / n;
    if (mean >= 105) return;
    const g = Math.max(0.45, Math.log(0.47) / Math.log(Math.max(mean, 4) / 255));
    const lut = new Uint8ClampedArray(256);
    for (let v = 0; v < 256; v++) lut[v] = 255 * Math.pow(v / 255, g);
    for (let i = 0; i < p.length; i += 4) { p[i] = lut[p[i]]; p[i + 1] = lut[p[i + 1]]; p[i + 2] = lut[p[i + 2]]; }
    ctx.putImageData(d, 0, 0);
  } catch {}
}
function fileToSelfie(file) {
  const img = new Image();
  img.onload = () => { S.selfie = squareJpeg(img, img.naturalWidth, img.naturalHeight, false); URL.revokeObjectURL(img.src); refreshSelfie(); };
  img.src = URL.createObjectURL(file);
}

async function saveForm() {
  const err = $("#err"); err.textContent = "";
  const name = $("#name").value.trim();
  const message = $("#msg").value.trim();
  const gender = $("input[name=gender]:checked")?.value;
  const interest = $("input[name=interest]:checked")?.value;
  if (!S.selfie) return err.textContent = "Falta tu selfie.";
  if (!name) return err.textContent = "Pon tu nombre.";
  if (!gender || !interest) return err.textContent = "Dinos qué eres y qué te interesa.";
  if (!S.editing && !$("#adult").checked) return err.textContent = "Tienes que confirmar que eres mayor de edad.";
  const side = $("input[name=side]:checked")?.value;
  if (hasSides() && !side) return err.textContent = `Dinos de parte de quién vienes (${S.event.sides[0]}, ${S.event.sides[1]} o los dos).`;
  const btn = $("#save"); btn.disabled = true; btn.textContent = "Guardando…";
  const data = { name, gender, interest, selfie: S.selfie, message, group: !!S.event.groups && !!$("#grp")?.checked };
  if (hasSides()) data.side = side;
  try {
    await S.api.saveProfile(S.eventId, S.uid, data);
    stopCam();
    S.me = { id: S.uid, ...data }; S.selfie = null;
    if (!groupsOn()) { S.groups = []; } setTimeout(syncPartners, 0); setTimeout(computeGroups, 0);
    const wasEditing = S.editing; S.editing = false;
    startMain();
    if (wasEditing) toast("Ficha actualizada");
  } catch (e) {
    console.error(e);
    btn.disabled = false; btn.textContent = S.editing ? "Guardar cambios" : "Entrar al radar";
    const denied = String(e?.code).includes("permission");
    err.textContent = !denied ? "No se ha podido guardar. Revisa tu conexión."
      : ended() ? "El radar de este evento está cerrado."
      : "No se ha podido guardar tu ficha (el servidor la ha rechazado). Avisa a quien organiza el evento.";
  }
}

        ${S.event.groups ? `<p class="small muted" style="margin:6px 0">${me.group ? "🔥 Te apuntas a match de grupo" : "No te apuntas a match de grupo"} <button type="button" class="info" data-info="grp" aria-label="Qué es">i</button></p>` : ""}
        ${me.message ? `<div class="hint" style="font-style:italic">“${esc(me.message)}”</div>` : ""}
        <p class="small muted" style="margin-top:12px">Guiños usados: ${S.sentTo.size} de ${MAX_SIGNALS}</p>
      </div>
      <button class="btn ghost block" id="edit">Editar ficha</button>
      <button class="btn ghost block" id="del" style="margin-top:10px;color:#B3261E">Salir y borrar mi ficha</button>
      <p class="small muted center" style="margin-top:16px">Tu ficha y tus guiños se borran al terminar el evento.</p>`;
  }

  app.innerHTML = `${demo}
    ${theme() === "neon" ? deco() : ""}<div class="topbar"><div><div class="brand sm">${esc(APP_NAME)}</div><div class="evname">${esc(S.event.name)}</div></div>
    <span class="pill">😉 ${signalsLeft()} ${signalsLeft() === 1 ? "guiño" : "guiños"}</span></div>
    ${body}`;

  if (!$(".tabs")) {
    const t = document.createElement("nav"); t.className = "tabs";
    t.innerHTML = `<div class="in"></div>`; document.body.appendChild(t);
  }
  $(".tabs .in").innerHTML = [["radar", "📡", "Radar"], ["matches", "💛", "Matches"], ["me", "🙂", "Mi ficha"]].map(([k, ic, l]) =>
    `<button class="${S.tab === k ? "on" : ""}" data-tab="${k}"><span class="ic">${ic}</span>${l}${k === "matches" && nMatches ? `<span class="badge">${nMatches}</span>` : ""}</button>`).join("");
  $(".tabs .in").onclick = (e) => { const b = e.target.closest("[data-tab]"); if (b) { S.tab = b.dataset.tab; render(); window.scrollTo(0, 0); if (S.tab === "matches") ensureContacts(true); } };

  app.querySelectorAll("[data-sig]").forEach(b => b.onclick = () => sendSignal(b.dataset.sig, b));
  app.querySelectorAll("[data-match]").forEach(b => b.onclick = () => { const p = profileById(b.dataset.match); if (p) showMatch(p); });
  $("#edit") && ($("#edit").onclick = () => { S.editing = true; S.selfie = null; S.view = "form"; $(".tabs")?.remove(); render(); });
  $("#del") && ($("#del").onclick = deleteMe);
}

async function sendSignal(id, btn) {
  const p = profileById(id); if (!p || S.sentTo.has(id) || !signalsLeft()) return;
  const ok = await ask(`<div class="pair"><img src="${safeImg(p.selfie)}" alt=""></div><h2 class="serif">¿Guiñarle a ${esc(p.name)}?</h2><p class="muted">Usarás 1 de tus ${signalsLeft()} guiños. ${esc(p.name)} solo lo sabrá si también te guiña.</p>`, "Mandar guiño");
  if (!ok) return;
  btn.disabled = true; btn.textContent = "Enviando…";
  try {
    const matched = await S.api.sendSignal(S.eventId, S.uid, id);
    if (!matched) toast(`Guiño enviado. Si ${p.name} te lo devuelve, os avisamos.`);
  } catch (e) {
    console.error(e); btn.disabled = false; btn.textContent = "😉 Guiñar";
    toast("No se ha podido enviar. Revisa tu conexión.");
  }
}

async function deleteMe() {
  const ok = await ask(`<h2 class="serif">¿Salir del radar?</h2><p class="muted">Se borrarán tu ficha y tus guiños. Podrás volver a entrar escaneando el QR.</p>`, "Borrar y salir");
  if (!ok) return;
  try {
    await S.api.deleteMe(S.eventId, S.uid);
    S.me = null; S.tab = "radar"; S.view = "welcome"; $(".tabs")?.remove(); render();
    toast("Tu ficha se ha borrado");
  } catch (e) { console.error(e); toast("No se ha podido borrar. Inténtalo otra vez."); }
}

boot();
</script>
</body>
</html>
