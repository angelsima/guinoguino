<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guiño guiño · Panel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E😉%3C/text%3E%3C/svg%3E">
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{--bg:#FBF6EF;--ink:#2B2320;--soft:#7A6E68;--line:#EADFD3;--accent:#D9573F;--accent-soft:#FBE3DC;--ok:#2F6B57;--ok-soft:#DCEFE6;--bad:#B3261E}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  main{max-width:760px;margin:0 auto;padding:24px 18px 60px}
  h1,h2{font-family:Georgia,serif;font-weight:normal}
  h1{margin:.2em 0}
  .muted{color:var(--soft)} .small{font-size:.85rem}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
  .btn{border:0;border-radius:999px;padding:.6em 1.1em;font:inherit;font-weight:600;cursor:pointer;background:var(--accent);color:#fff}
  .btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
  .btn.bad{background:transparent;border:1.5px solid #F0C9C5;color:var(--bad)}
  .btn[disabled]{opacity:.5}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  label{display:block;font-weight:600;margin:12px 0 4px}
  input{font:inherit;padding:.6em .8em;border:1.5px solid var(--line);border-radius:10px;width:100%;background:#fff}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}}
  code{background:#F3ECE3;padding:.15em .4em;border-radius:6px;font-size:.88em;word-break:break-all}
  .tag{display:inline-block;border-radius:999px;padding:.15em .7em;font-size:.8rem;font-weight:600}
  .tag.on{background:var(--ok-soft);color:var(--ok)} .tag.off{background:#EEE;color:#666}
  .qr{margin-top:12px;padding:12px;background:#fff;border:1px dashed var(--line);border-radius:12px;display:inline-block}
  .warn{background:#FFF3C9;color:#6B5200;border-radius:12px;padding:12px 14px}
  .ev h2{margin:.1em 0}
  .chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin-top:14px;cursor:pointer}
  .chk input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--accent)}
  .themes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
  .themes input{position:absolute;opacity:0}
  .themes label{margin:0;display:block;border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;font-weight:600;background:#fff}
  .themes input:checked+label{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .themes .sw{display:flex;gap:4px;margin-top:8px}.themes .sw i{width:22px;height:22px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.12)}
  .themes small{display:block;font-weight:400;color:var(--soft);margin-top:4px}
</style>
</head>
<body>
<main id="m"><p class="muted">Cargando…</p></main>

<script type="module">
if (!window.GUINO) { document.getElementById("m").innerHTML = '<h1>Error en config.js</h1><div class="warn">El archivo <code>config.js</code> no se ha podido leer: tiene un fallo de escritura. Revisa que pone <code>firebaseConfig: {</code> (con dos puntos), que no falta ninguna coma y que las llaves están bien cerradas.</div>'; throw new Error("config.js no se ha cargado"); }
const CFG = window.GUINO;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const M = $("#m");

if (!CFG.firebaseConfig?.apiKey) {
  M.innerHTML = `<h1>Panel de ${esc(CFG.appName || "Guiño guiño")}</h1>
  <div class="warn">Todavía no has pegado la configuración de Firebase en <code>config.js</code>. Sigue los pasos del archivo <b>LEEME.md</b>.<br><br>
  Mientras tanto puedes ver la web de invitados en modo demo: <a href="index.html">abrir demo</a>.</div>`;
  throw new Error("Sin configuración");
}

const V = "10.12.2";
const [appM, authM, fs] = await Promise.all([
  import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
  import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
  import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`)
]);
const app = appM.initializeApp(CFG.firebaseConfig);
const auth = authM.getAuth(app);
const db = fs.getFirestore(app);
const { doc, setDoc, updateDoc, deleteDoc, collection, getDocs, query, where, Timestamp, serverTimestamp, writeBatch } = fs;

const guestUrl = id => new URL(`index.html?e=${encodeURIComponent(id)}`, location.href).href;
const slug = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 30);
const rand = () => Math.random().toString(36).slice(2, 6);
const fmt = ms => new Date(ms).toLocaleString("es-ES", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const toLocalInput = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);

authM.onAuthStateChanged(auth, user => {
  if (!user || user.isAnonymous) return renderLogin();
  renderPanel(user);
});

function renderLogin() {
  M.innerHTML = `<h1>Panel de ${esc(CFG.appName || "Guiño guiño")}</h1>
    <p class="muted">Entra con tu cuenta de Google para crear eventos y sacar el QR.</p>
    <button class="btn" id="login">Entrar con Google</button>
    <p class="small muted" id="lerr"></p>`;
  $("#login").onclick = async () => {
    try { await authM.signInWithPopup(auth, new authM.GoogleAuthProvider()); }
    catch (e) { $("#lerr").textContent = "No se ha podido entrar: " + (e.code || e.message) + ". ¿Has activado Google en Authentication → Sign-in method?"; }
  };
}

async function renderPanel(user) {
  M.innerHTML = `<div class="row" style="justify-content:space-between">
      <h1>Panel de ${esc(CFG.appName || "Guiño guiño")}</h1>
      <button class="btn ghost" id="out">Salir</button></div>
    <p class="small muted">Sesión: ${esc(user.email || "")}</p>
    <div id="admincheck"></div>
    <div class="card">
      <h2>Nuevo evento</h2>
      <label>Tipo de evento</label>
      <div class="themes">
        <div><input type="radio" name="kind" id="k-boda" value="boda" checked><label for="k-boda">💍 Boda<small>Los invitados dicen de parte de quién vienen (de un novio, del otro o de los dos).</small></label></div>
        <div><input type="radio" name="kind" id="k-fiesta" value="fiesta"><label for="k-fiesta">🎉 Fiesta<small>Cualquier otro evento: cumpleaños, festival, fiesta privada…</small></label></div>
      </div>
      <div id="couple">
        <div class="grid2">
          <div><label for="s1">Nombre de un novio/a</label><input id="s1" maxlength="24" placeholder="Ana"></div>
          <div><label for="s2">Nombre del otro novio/a</label><input id="s2" maxlength="24" placeholder="Luis"></div>
        </div>
        <label class="chk"><input type="checkbox" id="grp"> <span><b>Permitir match de grupo 🔥</b><br><small class="muted">Si 3 o más invitados que lo hayan activado se guiñan todos con todos, se les avisa. Pregúntaselo a los novios: hay bodas donde no encaja. En las fiestas está siempre activado.</small></span></label>
      </div>
      <div class="grid2">
        <div><label for="n">Nombre del evento (lo verán los invitados)</label><input id="n" placeholder="Boda de Ana y Luis"></div>
        <div><label for="end">Se cierra el radar a las</label><input id="end" type="datetime-local"></div>
      </div>
      <label for="code">Código del enlace</label><input id="code" placeholder="se genera solo">
      <label>Diseño</label>
      <div class="themes">
        <div><input type="radio" name="theme" id="th-boda" value="boda" checked><label for="th-boda">Elegante<small>Como una invitación: marfil, verde salvia y oro.</small><span class="sw"><i style="background:#F6F1E7"></i><i style="background:#3E5C48"></i><i style="background:#B39257"></i></span></label></div>
        <div><input type="radio" name="theme" id="th-neon" value="neon"><label for="th-neon">Neón<small>Cartel de concierto: fondo noche, rosa, lima y azul eléctrico.</small><span class="sw"><i style="background:#0D0A12"></i><i style="background:#FF2D95"></i><i style="background:#C8FF2E"></i><i style="background:#4F7BFF"></i></span></label></div>
      </div>
      <div class="row" style="margin-top:14px"><button class="btn" id="create">Crear evento</button><span class="small muted" id="cmsg"></span></div>
    </div>
    <div id="events"></div>`;
  $("#out").onclick = () => authM.signOut(auth);
  const end = new Date(); end.setHours(end.getHours() + 8, 0, 0, 0); $("#end").value = toLocalInput(end);
  $("#n").oninput = () => { $("#n").dataset.touched = "1"; $("#code").placeholder = $("#n").value ? slug($("#n").value) + "-" + "xxxx" : "se genera solo"; };
  const syncKind = () => {
    const boda = document.querySelector("input[name=kind]:checked").value === "boda";
    $("#couple").style.display = boda ? "" : "none";
    $("#n").placeholder = boda ? "Boda de Ana y Luis" : "Fiesta de fin de año";
  };
  const autoName = () => {
    if ($("#n").dataset.touched) return;
    const a = $("#s1").value.trim(), b = $("#s2").value.trim();
    $("#n").value = a && b ? `Boda de ${a} y ${b}` : "";
    $("#code").placeholder = $("#n").value ? slug($("#n").value) + "-xxxx" : "se genera solo";
  };
  document.querySelectorAll("input[name=kind]").forEach(r => r.onchange = syncKind);
  $("#s1").oninput = autoName; $("#s2").oninput = autoName;
  syncKind();
  $("#create").onclick = () => createEvent(user);
  loadEvents(user);
}

function showNotAdmin(user) {
  $("#admincheck").innerHTML = `<div class="warn"><b>Último paso para ser administrador:</b> copia tu UID y pégalo en <code>firestore.rules</code> en lugar de <code>PEGA_AQUI_TU_UID</code>. Después pega las reglas en Firebase (Firestore → Reglas → Publicar) y recarga esta página.<br><br>
    Tu UID: <code id="uid">${esc(user.uid)}</code> <button class="btn ghost" id="cp" style="padding:.3em .8em">Copiar</button></div>`;
  $("#cp").onclick = () => navigator.clipboard.writeText(user.uid).then(() => $("#cp").textContent = "¡Copiado!");
}

async function createEvent(user) {
  const name = $("#n").value.trim(), endVal = $("#end").value;
  const code = slug($("#code").value.trim() || ($("#n").value ? slug($("#n").value) + "-" + rand() : ""));
  const msg = $("#cmsg");
  const kind = document.querySelector("input[name=kind]:checked")?.value === "fiesta" ? "fiesta" : "boda";
  const sides = [$("#s1").value.trim(), $("#s2").value.trim()];
  if (kind === "boda" && (!sides[0] || !sides[1])) return msg.textContent = "Pon el nombre de los dos novios.";
  if (!name || !endVal || !code) return msg.textContent = "Pon nombre y hora de cierre.";
  const endsAt = new Date(endVal);
  if (endsAt <= new Date()) return msg.textContent = "La hora de cierre tiene que ser futura.";
  $("#create").disabled = true; msg.textContent = "Creando…";
  try {
    const theme = document.querySelector("input[name=theme]:checked")?.value === "neon" ? "neon" : "boda";
    const data = { name, kind, theme, active: true, endsAt: Timestamp.fromDate(endsAt), createdAt: serverTimestamp(), owner: user.uid };
    if (kind === "boda") { data.sides = sides; data.groups = $("#grp").checked; } else data.groups = true;
    await setDoc(doc(db, "events", code), data);
    msg.textContent = "¡Creado!"; ["n", "code", "s1", "s2"].forEach(id => $("#" + id).value = ""); $("#grp").checked = false; delete $("#n").dataset.touched;
    loadEvents(user);
  } catch (e) {
    msg.textContent = e.code === "permission-denied" ? "Sin permiso: aún no eres admin (mira el aviso amarillo)." : "Error: " + (e.code || e.message);
    if (e.code === "permission-denied") showNotAdmin(user);
  } finally { $("#create").disabled = false; }
}

async function loadEvents(user) {
  const box = $("#events");
  box.innerHTML = `<p class="muted">Cargando eventos…</p>`;
  let snap;
  try { snap = await getDocs(query(collection(db, "events"), where("owner", "==", user.uid))); }
  catch (e) {
    box.innerHTML = "";
    if (e.code === "permission-denied") return showNotAdmin(user);
    box.innerHTML = `<p class="muted">Error cargando eventos: ${esc(e.code || e.message)}</p>`; return;
  }
  $("#admincheck").innerHTML = "";
  const evs = snap.docs.map(d => ({ id: d.id, ...d.data(), endsMs: d.data().endsAt?.toMillis?.() ?? 0 })).sort((a, b) => b.endsMs - a.endsMs);
  if (!evs.length) { box.innerHTML = `<p class="muted">Aún no tienes eventos.</p>`; return; }
  box.innerHTML = evs.map(ev => {
    const open = ev.active !== false && ev.endsMs > Date.now();
    return `<div class="card ev" data-id="${esc(ev.id)}">
      <div class="row" style="justify-content:space-between"><h2>${esc(ev.name)}</h2><span class="tag ${open ? "on" : "off"}">${open ? "Abierto" : "Cerrado"}</span></div>
      <p class="small muted">Cierra: ${esc(fmt(ev.endsMs))} · ${ev.kind === "fiesta" ? "Fiesta" : "Boda" + (Array.isArray(ev.sides) ? ` (${esc(ev.sides[0])} y ${esc(ev.sides[1])})` : "")} · Diseño: <b>${isNeon(ev) ? "Neón" : "Elegante"}</b> · Match de grupo: <b>${groupsOn(ev) ? "sí" : "no"}</b> · <span class="stats">contando…</span></p>
      <p class="small">Enlace: <code>${esc(guestUrl(ev.id))}</code></p>
      <div class="row">
        <button class="btn ghost" data-a="copy">Copiar enlace</button>
        <button class="btn ghost" data-a="qr">Ver QR</button>
        <button class="btn ghost" data-a="poster">Imprimir cartel</button>
        ${ev.kind === "fiesta" ? "" : `<button class="btn ghost" data-a="groups">${groupsOn(ev) ? "Quitar match de grupo" : "Permitir match de grupo"}</button>`}
        <button class="btn ghost" data-a="theme">Cambiar a ${isNeon(ev) ? "Elegante" : "Neón"}</button>
        <button class="btn ghost" data-a="toggle">${ev.active !== false ? "Cerrar radar" : "Reabrir radar"}</button>
        <button class="btn bad" data-a="wipe">Borrar fichas</button>
        <button class="btn bad" data-a="del">Eliminar evento</button>
      </div>
      <div class="qrwrap"></div></div>`;
  }).join("");
  evs.forEach(ev => countStats(ev.id));
  box.onclick = async (e) => {
    const b = e.target.closest("[data-a]"); if (!b) return;
    const card = b.closest(".ev"), id = card.dataset.id, ev = evs.find(x => x.id === id);
    const a = b.dataset.a;
    if (a === "copy") { await navigator.clipboard.writeText(guestUrl(id)); b.textContent = "¡Copiado!"; }
    if (a === "qr") { const w = card.querySelector(".qrwrap"); if (w.innerHTML) { w.innerHTML = ""; return; } drawQR(w, id); }
    if (a === "poster") printPoster(ev);
    if (a === "groups") { await updateDoc(doc(db, "events", id), { groups: !groupsOn(ev) }); loadEvents(user); }
    if (a === "theme") { await updateDoc(doc(db, "events", id), { theme: isNeon(ev) ? "boda" : "neon" }); loadEvents(user); }
    if (a === "toggle") { await updateDoc(doc(db, "events", id), { active: ev.active === false }); loadEvents(user); }
    if (a === "wipe" && confirm(`¿Borrar todas las fichas, guiños y matches de "${ev.name}"? No se puede deshacer.`)) { b.disabled = true; await wipe(id); countStats(id); b.disabled = false; }
    if (a === "del" && confirm(`¿Eliminar "${ev.name}" y todos sus datos?`)) { await wipe(id); await deleteDoc(doc(db, "events", id)); loadEvents(user); }
  };
}

async function countStats(id) {
  const el = document.querySelector(`.ev[data-id="${CSS.escape(id)}"] .stats`); if (!el) return;
  try {
    const [p, m] = await Promise.all([getDocs(collection(db, "events", id, "profiles")), getDocs(collection(db, "events", id, "matches"))]);
    const s = await getDocs(collection(db, "events", id, "signals"));
    el.textContent = `${p.size} fichas · ${s.size} guiños · ${m.size} matches`;
  } catch { el.textContent = "sin datos"; }
}

async function wipe(id) {
  // Los mensajes privados no se pueden listar desde aquí: se borran por el id de cada ficha.
  const profs = await getDocs(collection(db, "events", id, "profiles"));
  for (let i = 0; i < profs.docs.length; i += 400) {
    const batch = writeBatch(db);
    profs.docs.slice(i, i + 400).forEach(d => { batch.delete(doc(db, "events", id, "contacts", d.id)); batch.delete(doc(db, "events", id, "optins", d.id)); });
    await batch.commit();
  }
  for (const name of ["profiles", "signals", "matches", "shares"]) {
    const snap = await getDocs(collection(db, "events", id, name));
    for (let i = 0; i < snap.docs.length; i += 400) {
      const batch = writeBatch(db);
      snap.docs.slice(i, i + 400).forEach(d => batch.delete(d.ref));
      await batch.commit();
    }
  }
}

function drawQR(el, id, size = 240) {
  el.innerHTML = `<div class="qr"><div class="q"></div><div class="row" style="margin-top:10px"><button class="btn ghost" data-dl>Descargar PNG</button></div></div>`;
  new QRCode(el.querySelector(".q"), { text: guestUrl(id), width: size, height: size, correctLevel: QRCode.CorrectLevel.M });
  el.querySelector("[data-dl]").onclick = () => {
    const c = el.querySelector("canvas"); const a = document.createElement("a");
    a.href = c.toDataURL("image/png"); a.download = `qr-${id}.png`; a.click();
  };
}

const isNeon = (ev) => ev.theme === "neon" || ev.theme === "fiesta";
const groupsOn = (ev) => ev.kind === "fiesta" || ev.groups === true;

function posterDeco(theme) {
  if (theme === "neon") {
    const app = esc(CFG.appName || "Guiño guiño");
    const unit = `<span>${app}</span><i>●</i><span>¿Estás soltero o soltera?</span><i>●</i>`;
    return `<div class="tk"><div>${unit.repeat(6)}</div></div>`;
  }
  let l = "";
  for (let i = 0; i < 6; i++) {
    const d = 18 + i * 13, up = i % 2 ? -1 : 1;
    l += `<ellipse cx="${200 - d}" cy="${26 + up * 6}" rx="8" ry="3" transform="rotate(${up * -28} ${200 - d} ${26 + up * 6})"/><ellipse cx="${200 + d}" cy="${26 + up * 6}" rx="8" ry="3" transform="rotate(${up * 28} ${200 + d} ${26 + up * 6})"/>`;
  }
  return `<svg viewBox="0 0 400 52" style="width:300px;display:block;margin:0 auto"><path d="M10 26H100M300 26H390" stroke="#B39257" stroke-width="1"/><path d="M100 26H300" stroke="#3E5C48" stroke-width="1.2" opacity=".6"/><g fill="#3E5C48" opacity=".8">${l}</g><circle cx="200" cy="26" r="4" fill="#B39257"/></svg>`;
}

function printPoster(ev) {
  const theme = isNeon(ev) ? "neon" : "boda";
  const app = CFG.appName || "Guiño guiño";
  const tmp = document.createElement("div");
  new QRCode(tmp, { text: guestUrl(ev.id), width: 600, height: 600, colorDark: theme === "neon" ? "#0D0A12" : "#26342B", correctLevel: QRCode.CorrectLevel.M });
  const png = tmp.querySelector("canvas").toDataURL("image/png");
  const w = window.open("", "_blank");
  if (!w) return alert("Permite las ventanas emergentes para imprimir el cartel.");
  const fonts = `<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">`;
  const side = ev.kind !== "fiesta" && Array.isArray(ev.sides);
  const boda = `
  <style>@page{size:A4;margin:0}*{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:#F6F1E7;color:#26342B;font-family:"Cormorant Garamond",Georgia,serif;text-align:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .p{height:100vh;padding:14mm;display:flex}
  .f1{flex:1;border:1.5px solid #B39257;padding:5mm;display:flex}
  .f2{flex:1;border:.6px solid #B39257;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10mm 14mm}
  .b{font-family:"Great Vibes",cursive;font-size:64px;color:#B39257;line-height:1;margin:8px 0 2px}
  .e{font-style:italic;font-size:24px;letter-spacing:.02em;color:#3E5C48}
  h1{font-weight:500;font-size:50px;line-height:1.08;margin:22px 0 6px}
  p{font-size:22px;color:#4E5A52;max-width:460px;margin:6px auto;line-height:1.35}
  .q{margin:24px 0 18px;padding:14px;background:#fff;border:1px solid #B39257;outline:1px solid #E2D7C2;outline-offset:6px}
  .q img{width:280px;height:280px;display:block}
  .s{font-size:17px;color:#6E786F}</style></head><body><div class="p"><div class="f1"><div class="f2">
  ${posterDeco("boda")}
  <div class="b">${esc(app)}</div><div class="e">${esc(ev.name)}</div>
  <h1>¿Estás soltero<br>o soltera?</h1>
  <p>Escanea y descubre si alguien de aquí quiere conocerte.</p>
  <div class="q"><img src="${png}" alt="QR"></div>
  <p class="s">Nadie sabrá que le has guiñado… salvo que te guiñe también.<br>Todo se borra al terminar la fiesta.</p>
  ${posterDeco("boda")}
  </div></div></div>`;
  const neon = `
  <style>@page{size:A4;margin:0}*{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:#0D0A12;color:#F7F3FF;font-family:Inter,Helvetica,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .p{height:100vh;display:flex;flex-direction:column;overflow:hidden}
